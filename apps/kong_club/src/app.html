<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Kong Club</title>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		%sveltekit.head%
		<link rel="stylesheet" href="%sveltekit.assets%/trifecta/loader.css" />
		<link
			rel="preload"
			href="%sveltekit.assets%/assets/fonts/Fredoka-Variable.ttf"
			as="font"
			type="font/ttf"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/assets/fonts/FredokaOne-Regular.ttf"
			as="font"
			type="font/ttf"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/assets/fonts/LilitaOne-Regular.ttf"
			as="font"
			type="font/ttf"
			crossorigin
		/>
		<style>
			/* Local fonts only — Stake CSP blocks Google Fonts / Typekit. */
			@font-face {
				font-family: 'Inter';
				src: url('%sveltekit.assets%/assets/fonts/Inter-Variable.ttf') format('truetype');
				font-weight: 100 900;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: 'Fredoka';
				src: url('%sveltekit.assets%/assets/fonts/Fredoka-Variable.ttf') format('truetype');
				font-weight: 300 900;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: 'Fredoka One';
				src: url('%sveltekit.assets%/assets/fonts/FredokaOne-Regular.ttf') format('truetype');
				font-weight: 400;
				font-style: normal;
				font-display: block;
			}
			@font-face {
				font-family: 'Lilita One';
				src: url('%sveltekit.assets%/assets/fonts/LilitaOne-Regular.ttf') format('truetype');
				font-weight: 400;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: 'Rubik';
				src: url('%sveltekit.assets%/assets/fonts/Rubik-SemiBold.woff2') format('woff2');
				font-weight: 600;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: 'Rubik';
				src: url('%sveltekit.assets%/assets/fonts/Rubik-Bold.woff2') format('woff2');
				font-weight: 700;
				font-style: normal;
				font-display: swap;
			}
			html,
			body {
				margin: 0;
				padding: 0;
				overflow: hidden;
				touch-action: none;
				background-color: black;
				color: #fff;
				font-family: 'Fredoka One', Inter, sans-serif;
				font-synthesis: none;
				width: 100%;
				height: 100%;
				height: 100dvh;
			}
		</style>
	</head>
	<body>
		<main id="trifecta-site-loader" class="site-loader is-playing" aria-label="Trifecta loading">
			<div class="grid-vignette" aria-hidden="true"><div class="triangle-grid"></div></div>
			<canvas class="light-waves" aria-hidden="true"></canvas>
			<div class="edge-shade" aria-hidden="true"></div>
			<section class="site-loader-brand" aria-label="Trifecta">
				<div class="site-loader-lockup">
					<div class="site-loader-mark" aria-hidden="true">
						<img
							class="trinity"
							src="%sveltekit.assets%/trifecta/triforce-svgrepo-com.svg"
							width="80"
							height="80"
							alt=""
							draggable="false"
						/>
					</div>
					<p class="site-loader-name">TRIFECTA</p>
				</div>
				<div
					class="site-loader-progress"
					role="progressbar"
					aria-label="Loading progress"
					aria-valuemin="0"
					aria-valuemax="100"
					aria-valuenow="0"
				>
					<span></span>
				</div>
			</section>
		</main>
		<script src="%sveltekit.assets%/trifecta/vendor/xmb/spline-reverse.js"></script>
		<script src="%sveltekit.assets%/trifecta/vendor/xmb/spline.js"></script>
		<script src="%sveltekit.assets%/trifecta/script.js"></script>
		<script src="%sveltekit.assets%/trifecta/loader.js"></script>
		<script>
			window.setTimeout(function () {
				if (document.getElementById('trifecta-site-loader')) {
					window.dispatchEvent(new CustomEvent('kong-club:ready'));
				}
			}, 15000);
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
